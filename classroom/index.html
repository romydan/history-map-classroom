<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbecdf">
  <meta name="description" content="按人教版初中历史教材逐课学习，在真实地形地图上理解历史事件、路线与时序。支持课堂授课和自主学习。">
  <title>历史地图课堂 · 按教材读历史</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./css/classroom.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到课程内容</a>
  <header class="app-header">
    <a class="brand" href="#view=home" aria-label="历史地图课堂，返回课程首页">
      <svg class="brand-mark" viewBox="0 0 48 44" aria-hidden="true"><path d="M3 8 17 3 31 9 45 3v33l-14 5-14-6-14 5Z M17 3v32 M31 9v32"/></svg><span>历史地图课堂</span>
    </a>
    <a class="upstream-credit" href="https://github.com/DeanChensj/jiangshan-map" target="_blank" rel="noopener noreferrer">基于江山时序</a>
    <nav class="home-nav" aria-label="课程导航"><a href="#view=home" aria-current="page">教材课程</a><button type="button" data-action="progress">我的学习</button></nav>
    <div class="mode-switch" role="group" aria-label="使用模式"><button type="button" data-mode="teacher" aria-pressed="true">课堂授课</button><button type="button" data-mode="student" aria-pressed="false">自主学习</button></div>
    <button type="button" class="mobile-learning" data-action="progress">我的学习</button>
    <div class="search-wrap">
      <label class="sr-only" for="search">搜索本册课程、人物或事件</label>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
      <input id="search" type="search" placeholder="搜本册课程、人物或事件" autocomplete="off" aria-controls="search-results" aria-expanded="false">
      <div id="search-results" class="search-results" role="region" aria-label="搜索结果" hidden></div>
    </div>
    <div class="header-actions">
      <button type="button" class="utility" data-action="present" aria-label="投屏"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="3.5" width="19" height="13" rx="1"/><path d="M12 17v4M7 21h10"/></svg><span>投屏</span></button>
      <button type="button" class="utility" data-action="share" aria-label="分享"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V2m-5 5 5-5 5 5M5 11H3v10h18V11h-2"/></svg><span>分享</span></button>
    </div>
  </header>
  <nav id="breadcrumb" class="breadcrumb" aria-label="当前位置"></nav>
  <main id="main" tabindex="-1"><p class="loading-message">正在载入教材课程与地图…</p></main>
  <aside id="source-sheet" class="source-sheet" aria-labelledby="source-title" hidden></aside>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="loading-message">此网站需要启用 JavaScript，才能按课切换地图与学习内容。</p></noscript>
</body>
</html>
