name: Deploy history classroom
on:
  push:
    branches: [classroom]
    paths:
      - 'classroom/**'
      - '.github/workflows/classroom-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: classroom-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate curriculum and publication boundary
        run: node classroom/scripts/validate.mjs
      - name: Build classroom static artifact
        run: node classroom/scripts/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: classroom-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
